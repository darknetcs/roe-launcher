[package]
name = "roe-core"
version = "0.1.5"
edition = "2021"
description = "Core logic of the Ring of Elysium local-server launcher (no GUI)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "native-certs"] }
flate2 = "1"
tar = "0.4"
# Windows: the portable Python and .NET come as zip files (tested on every platform)
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"
