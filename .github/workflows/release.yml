# Linux: built on an OLD glibc (Ubuntu 22.04, glibc 2.35) so the binary runs on every mainstream
# distro released since (Debian 12, Ubuntu 22.04+, Fedora, Arch, SteamOS ...).
# Windows x64: built on a real Windows runner with the MSVC toolchain and a static C runtime (no Visual C++
# redistributable needed), after the core tests pass there. MSVC instead of a MinGW cross-build, plus the embedded
# version information (crates/roe-launcher/windows), makes antivirus heuristics far less likely to flag the exe.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
# attaching the packages to the GitHub release needs write access to the repository contents
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the core
        run: cargo test -p roe-core
      - name: Build
        run: cargo build --release -p roe-launcher
      - name: Package
        run: |
          mkdir -p dist/roe-launcher
          cp target/release/roe-launcher dist/roe-launcher/
          cp packaging/roe-launcher.desktop README.md LICENSE NOTICE.md crates/roe-launcher/assets/fonts/gemina2.txt dist/roe-launcher/
          tar -C dist -czf roe-launcher-linux-x86_64.tar.gz roe-launcher
          sha256sum roe-launcher-linux-x86_64.tar.gz > roe-launcher-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: roe-launcher-linux-x86_64
          path: |
            roe-launcher-linux-x86_64.tar.gz
            roe-launcher-linux-x86_64.tar.gz.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            roe-launcher-linux-x86_64.tar.gz
            roe-launcher-linux-x86_64.tar.gz.sha256

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test the core on Windows
        run: cargo test -p roe-core --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release -p roe-launcher --target x86_64-pc-windows-msvc
      - name: Package
        run: |
          mkdir -p dist/roe-launcher
          cp target/x86_64-pc-windows-msvc/release/roe-launcher.exe README.md LICENSE NOTICE.md crates/roe-launcher/assets/fonts/gemina2.txt dist/roe-launcher/
          (cd dist && 7z a -tzip ../roe-launcher-windows-x86_64.zip roe-launcher > /dev/null)
          # exactly "<hex>  <name>": Git Bash's sha256sum may print "<hex> *<name>", which launchers up to v0.1.9
          # (their self-update reads this file) would not accept
          hash=$(sha256sum roe-launcher-windows-x86_64.zip | cut -c1-64)
          printf '%s  %s\n' "$hash" roe-launcher-windows-x86_64.zip > roe-launcher-windows-x86_64.zip.sha256
          cat roe-launcher-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: roe-launcher-windows-x86_64
          path: |
            roe-launcher-windows-x86_64.zip
            roe-launcher-windows-x86_64.zip.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            roe-launcher-windows-x86_64.zip
            roe-launcher-windows-x86_64.zip.sha256
